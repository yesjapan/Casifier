<div id="CasifierConfigPage" data-role="page" class="page type-interior pluginConfigurationPage">
  <div data-role="content">
    <div class="content-primary">
      <form id="CasifierConfigForm">
        <div class="sectionTitleContainer flex align-items-center">
          <h2 class="sectionTitle">Casifier</h2>
        </div>

        <style>
          .casifierPreviewGrid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(8.5em, 1fr));
            gap: 1.25em;
            margin: 1em 0 2em;
            max-width: 42em;
          }

          .casifierPreviewItem {
            min-width: 0;
          }

          .casifierPreviewItem svg {
            display: block;
            width: 100%;
            max-width: 11em;
            height: auto;
            filter: drop-shadow(0 0.9em 0.9em rgba(0, 0, 0, 0.35));
          }

          .casifierPreviewLabel {
            margin-top: 0.65em;
            font-weight: 600;
          }

          .casifierPreviewMeta {
            margin-top: 0.2em;
            color: var(--secondaryTextColor);
            font-size: 0.9em;
          }
        </style>

        <div class="casifierPreviewGrid" aria-label="Generated case preview samples">
          <div class="casifierPreviewItem">
            <svg viewBox="0 0 180 278" role="img" aria-label="DVD preview">
              <defs>
                <linearGradient id="casifierPosterDvd" x1="0" x2="1" y1="0" y2="1">
                  <stop offset="0" stop-color="#d95d39" />
                  <stop offset="0.58" stop-color="#253858" />
                  <stop offset="1" stop-color="#101820" />
                </linearGradient>
              </defs>
              <rect x="20" y="6" width="140" height="254" rx="2" fill="#111" />
              <rect x="20" y="6" width="140" height="254" fill="url(#casifierPosterDvd)" />
              <circle cx="119" cy="82" r="27" fill="#ffd166" opacity="0.9" />
              <path d="M20 202 L58 152 L83 178 L106 138 L160 212 L160 260 L20 260 Z" fill="#0c1624" opacity="0.82" />
              <text x="90" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">POSTER</text>
              <rect x="20" y="6" width="140" height="28" fill="#f2f2f2" opacity="0.94" />
              <rect x="20" y="6" width="140" height="254" fill="none" stroke="#000" stroke-width="3" />
              <rect x="25" y="11" width="130" height="244" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="1.5" />
              <rect x="20" y="34" width="140" height="4" fill="#fff" opacity="0.14" />
              <rect x="20" y="34" width="140" height="6" fill="#000" opacity="0.28" />
              <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#202020">DVD</text>
            </svg>
            <div class="casifierPreviewLabel">DVD</div>
            <div class="casifierPreviewMeta">SD / 720p</div>
          </div>

          <div class="casifierPreviewItem">
            <svg viewBox="0 0 180 278" role="img" aria-label="Blu-ray preview">
              <defs>
                <linearGradient id="casifierPosterBluray" x1="0" x2="1" y1="0" y2="1">
                  <stop offset="0" stop-color="#79d2c0" />
                  <stop offset="0.58" stop-color="#42526e" />
                  <stop offset="1" stop-color="#172b4d" />
                </linearGradient>
              </defs>
              <rect x="20" y="6" width="140" height="254" rx="2" fill="#111" />
              <rect x="20" y="6" width="140" height="254" fill="url(#casifierPosterBluray)" />
              <ellipse cx="96" cy="99" rx="48" ry="58" fill="#d6f6ff" opacity="0.18" />
              <path d="M46 200 C70 170 94 177 109 204 C121 226 144 215 158 198 L158 260 L46 260 Z" fill="#102a43" opacity="0.86" />
              <text x="90" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">POSTER</text>
              <rect x="20" y="6" width="140" height="28" fill="#1658ba" opacity="0.94" />
              <rect x="20" y="6" width="140" height="254" fill="none" stroke="#000" stroke-width="3" />
              <rect x="25" y="11" width="130" height="244" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="1.5" />
              <rect x="20" y="34" width="140" height="4" fill="#fff" opacity="0.14" />
              <rect x="20" y="34" width="140" height="6" fill="#000" opacity="0.28" />
              <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">BLU-RAY</text>
            </svg>
            <div class="casifierPreviewLabel">Blu-ray</div>
            <div class="casifierPreviewMeta">1080p</div>
          </div>

          <div class="casifierPreviewItem">
            <svg viewBox="0 0 180 278" role="img" aria-label="Ultra HD preview">
              <defs>
                <linearGradient id="casifierPosterUltra" x1="0" x2="1" y1="0" y2="1">
                  <stop offset="0" stop-color="#f7c948" />
                  <stop offset="0.45" stop-color="#7a3e9d" />
                  <stop offset="1" stop-color="#0b1026" />
                </linearGradient>
              </defs>
              <rect x="20" y="6" width="140" height="254" rx="2" fill="#111" />
              <rect x="20" y="6" width="140" height="254" fill="url(#casifierPosterUltra)" />
              <path d="M96 52 L112 100 L156 101 L121 130 L134 178 L96 150 L58 178 L71 130 L36 101 L80 100 Z" fill="#fff2b8" opacity="0.78" />
              <rect x="20" y="194" width="140" height="66" fill="#111" opacity="0.5" />
              <text x="90" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">POSTER</text>
              <rect x="20" y="6" width="140" height="28" fill="#171717" opacity="0.94" />
              <rect x="20" y="6" width="140" height="254" fill="none" stroke="#000" stroke-width="3" />
              <rect x="25" y="11" width="130" height="244" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="1.5" />
              <rect x="20" y="34" width="140" height="4" fill="#fff" opacity="0.14" />
              <rect x="20" y="34" width="140" height="6" fill="#000" opacity="0.28" />
              <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#f6d451">ULTRA HD</text>
            </svg>
            <div class="casifierPreviewLabel">Ultra HD</div>
            <div class="casifierPreviewMeta">2160p / 4K</div>
          </div>
        </div>

        <label class="checkboxContainer">
          <input is="emby-checkbox" type="checkbox" id="Enabled" />
          <span>Enable Casifier</span>
        </label>

        <label class="checkboxContainer">
          <input is="emby-checkbox" type="checkbox" id="RunAfterLibraryScan" />
          <span>Run after library scans</span>
        </label>

        <label class="checkboxContainer">
          <input is="emby-checkbox" type="checkbox" id="OverwritePrimaryPoster" />
          <span>Replace primary posters with generated case posters</span>
        </label>

        <div class="inputContainer">
          <input is="emby-input" id="BackupSuffix" label="Backup suffix" />
          <div class="fieldDescription">Casifier stores the original poster beside the generated poster using this suffix.</div>
        </div>

        <div>
          <button is="emby-button" type="submit" class="raised button-submit block">
            <span>Save</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script type="text/javascript">
    (() => {
      const pluginId = '6de807d7-041d-4592-a278-91f04a37ec0f';
      const page = document.querySelector('#CasifierConfigPage');

      page.addEventListener('pageshow', async () => {
        Dashboard.showLoadingMsg();

        const config = await ApiClient.getPluginConfiguration(pluginId);
        page.querySelector('#Enabled').checked = config.Enabled ?? true;
        page.querySelector('#RunAfterLibraryScan').checked = config.RunAfterLibraryScan ?? true;
        page.querySelector('#OverwritePrimaryPoster').checked = config.OverwritePrimaryPoster ?? true;
        page.querySelector('#BackupSuffix').value = config.BackupSuffix || '.casifier-original';

        Dashboard.hideLoadingMsg();
      });

      page.querySelector('#CasifierConfigForm').addEventListener('submit', async event => {
        event.preventDefault();
        Dashboard.showLoadingMsg();

        const config = await ApiClient.getPluginConfiguration(pluginId);
        config.Enabled = page.querySelector('#Enabled').checked;
        config.RunAfterLibraryScan = page.querySelector('#RunAfterLibraryScan').checked;
        config.OverwritePrimaryPoster = page.querySelector('#OverwritePrimaryPoster').checked;
        config.BackupSuffix = page.querySelector('#BackupSuffix').value || '.casifier-original';

        const result = await ApiClient.updatePluginConfiguration(pluginId, config);
        Dashboard.processPluginConfigurationUpdateResult(result);
      });
    })();
  </script>
</div>
